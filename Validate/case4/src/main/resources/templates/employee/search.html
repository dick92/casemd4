<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Kết quả tìm kiếm</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="container mt-5">
<h1 class="text-info mb-4">Kết quả tìm kiếm</h1>

<form th:action="@{/admin/employees/search}" method="get" class="mb-3">
  <input type="text" name="keyword" placeholder="Nhập tên cần tìm" class="form-control w-50 d-inline-block" />
  <button type="submit" class="btn btn-primary">Tìm tiếp</button>
</form>

<a th:href="@{/admin/employees}" class="btn btn-secondary mb-3">Quay lại danh sách</a>

<table class="table table-bordered table-hover">
  <thead class="table-light">
  <tr>
    <th>ID</th>
    <th>Họ tên</th>
    <th>Chức vụ</th>
    <th>Email</th>
    <th>Điện thoại</th>
    <th>Ngày vào làm</th>
    <th>Hành động</th>
  </tr>
  </thead>
  <tbody>
  <tr th:each="employee : ${employees}">
    <td th:text="${employee.id}"></td>
    <td th:text="${employee.fullName}"></td>
    <td th:text="${employee.position}"></td>
    <td th:text="${employee.email}"></td>
    <td th:text="${employee.phone}"></td>
    <td th:text="${employee.hireDate}"></td>
    <td>
      <a th:href="@{/admin/employees/edit/{id}(id=${employee.id})}" class="btn btn-warning btn-sm">✏️</a>
      <form th:action="@{/admin/employees/delete/{id}(id=${employee.id})}" method="post"
            th:object="${employee}"
            style="display:inline;"
            onsubmit="return confirm('Bạn có chắc muốn xoá không?')">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <button type="submit" class="btn btn-danger btn-sm">🗑️</button>
      </form>
    </td>
  </tr>
  </tbody>
</table>
</body>
</html>
