<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dịch vụ căn hộ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="container mt-5">

<h1 class="text-info mb-4">Dịch vụ đi kèm của căn hộ <span th:text="${apartment.name}">Tên căn hộ</span></h1>

<a th:href="@{/admin/apartments}" class="btn btn-secondary mb-3">Quay lại danh sách căn hộ</a>

<table class="table table-bordered table-hover">
    <thead class="table-light">
    <tr>
        <th>Tên dịch vụ</th>
        <th>Mô tả</th>
        <th>Đơn giá</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="as : ${services}">
        <td th:text="${as.service.name}">Dịch vụ</td>
        <td th:text="${as.service.description}">Mô tả</td>
        <td th:text="${as.service.unitPrice}">Giá</td>
    </tr>
    </tbody>
</table>

</body>
</html>
