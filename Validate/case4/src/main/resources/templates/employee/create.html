<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Thêm nhân viên</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="container mt-5">
<h1 class="text-primary mb-4">➕ Thêm nhân viên mới</h1>

<form th:action="@{/admin/employees}" th:object="${employee}" method="post" class="form">
  <div class="mb-3">
    <label>Họ tên:</label>
    <input type="text" th:field="*{fullName}" class="form-control" required />
  </div>
  <div class="mb-3">
    <label>Chức vụ:</label>
    <input type="text" th:field="*{position}" class="form-control" required />
  </div>
  <div class="mb-3">
    <label>Email:</label>
    <input type="email" th:field="*{email}" class="form-control" required />
  </div>
  <div class="mb-3">
    <label>Điện thoại:</label>
    <input type="text" th:field="*{phone}" class="form-control" required />
  </div>
  <div class="mb-3">
    <label>Ngày vào làm:</label>
    <input type="date" th:field="*{hireDate}" class="form-control" required />
  </div>
  <button type="submit" class="btn btn-success">Lưu</button>
  <a th:href="@{/admin/employees}" class="btn btn-secondary">Quay lại</a>
</form>
</body>
</html>
