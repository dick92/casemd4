<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Xoá nhân viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="container mt-5">
<h1 class="text-danger mb-4">Xác nhận xoá nhân viên</h1>

<p>Bạn có chắc chắn muốn xoá nhân viên <strong th:text="${employee.fullName}">Tên</strong> không?</p>

<form th:action="@{/admin/employees/delete/{id}(id=${employee.id})}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
    <button type="submit" class="btn btn-danger" onclick="return confirm('Bạn có chắc muốn xoá không?')">🗑️ Đồng ý xoá</button>
    <a th:href="@{/admin/employees}" class="btn btn-secondary">Huỷ</a>
</form>
</body>
</html>
