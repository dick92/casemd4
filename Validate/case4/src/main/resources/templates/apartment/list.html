<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Danh sách căn hộ</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="container mt-5">
<h1 class="text-success mb-4">Danh sách căn hộ</h1>

<table class="table table-bordered table-hover">
  <thead>
  <tr>
    <th>ID</th>
    <th>Tên</th>
    <th>Vị trí</th>
    <th>Giá</th>
    <th>Trạng thái</th>
    <th>Hành động</th>
  </tr>
  </thead>
  <tbody>
  <tr th:each="ap : ${apartments}">
    <td th:text="${ap.id}"></td>
    <td th:text="${ap.name}"></td>
    <td th:text="${ap.location}"></td>
    <td th:text="${ap.price} + ' đ'"></td>
    <td th:text="${ap.status}"></td>
    <td>
      <a th:href="@{/admin/apartments/{id}/services(id=${ap.id})}" class="btn btn-info btn-sm">Xem dịch vụ</a>
    </td>
  </tr>
  </tbody>
</table>

<a th:href="@{/}" class="btn btn-secondary">⬅ Quay lại</a>
</body>
</html>
